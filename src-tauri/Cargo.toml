[package]
name = "studiocut-ai"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"

[lib]
path = "src/lib.rs"
test = true
doctest = false

[[bin]]
name = "studiocut-ai"
path = "src/main.rs"
test = false

[[test]]
name = "persistence"
path = "tests/persistence.rs"

[[test]]
name = "media"
path = "tests/media.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "multipart", "rustls-tls", "json"] }
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
zeroize = "1"
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
sha2 = "0.10"
schemars = { version = "0.8", features = ["uuid1"] }
# BlazeFace full-range face detection (bundled ONNX, converted
# in-house from the official MediaPipe `.tflite`; see
# `assets/face-detection/README.md`). CPU-only: no GPU backends.
# `tract` 0.23 declares rust-version 1.91, which is why this package
# requires 1.91 (CI builds on stable, so this is a floor, not a pin).
tract = { version = "0.23", default-features = false, features = ["onnx"] }
